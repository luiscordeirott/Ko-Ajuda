<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ko-Ajuda</title>
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="assets/img/logotype-white.svg" alt="">
        </div>
        <div class="header-search">
            <p>O que você quer aprender hoje?</p>
            <div class="header-search-icon">
                <i class="ph ph-magnifying-glass"></i>
            </div>
        </div>
        <div class="header-account">
            <a href="">Cadastrar-se</a>
            <a href="" class="button">ENTRAR</a>
        </div>
    </header>
    <nav>
        <p>Inicio</p>
        <p>Sobre nós</p>
        <p>Aprender</p>
        <p>Contato</p>
    </nav>
    <main>
        <section id="hero">

            <div class="hero-text">
                <h1 class="h1-inicio">NAVEGUE SEGURO</h1>

                <p>Mais do que aprendizado, AQUI a ajuda começa desde o mais básico até aprender a ter sua própria
                    autonomia.</p>



                <div class="hero-buttons">

                    <div class="button">
                        <a href="#">Doação</a>
                    </div>

                    <div class="button">
                        <a href="#">Noticias</a>
                    </div>

                </div>

            </div>

           


            <div class="imagem-herosection">
                <img src="header img.png" alt="">
            </div>

        </section>
        <div class="alert-status">
            <p></p>
        </div>
        <div class="alert">
            <div class="alert-cards"></div>
            <div class="alert-cards"></div>
            <div class="alert-cards"></div>
            <div class="alert-cards"></div>
        </div>
        <div class="learn">
            <div class="learn-cards"></div>
            <div class="learn-cards"></div>
            <div class="learn-cards"></div>
            <div class="learn-cards"></div>
        </div>
        <div class="info">
            <div class="info-cards"></div>
            <div class="info-cards"></div>
            <div class="info-cards"></div>
            <div class="info-cards"></div>
        </div>
        <div class="student">
            <div class="student-cards"></div>
            <div class="student-cards"></div>
            <div class="student-cards"></div>
            <div class="student-cards"></div>
        </div>
        <footer>
            <div class="footer-brand">
                <div class="logo"></div>
                <p></p>
            </div>
            <div class="footer-info"></div>
            <div class="footer-bottom">
                <p></p>
                <p></p>
            </div>
        </footer>
    </main>
</body>

</html>
